global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: cloud-ops
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    sample_limit: 10000
    body_size_limit: 1MB
    static_configs:
      - targets: [host.docker.internal:9464]
  # Empty discovery files keep optional sources absent, rather than pretending healthy.
  - job_name: cloud-controller
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    sample_limit: 10000
    body_size_limit: 1MB
    file_sd_configs:
      - files: [/etc/prometheus/controller-targets.json]
  - job_name: academic-api
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    sample_limit: 10000
    body_size_limit: 1MB
    file_sd_configs:
      - files: [/etc/prometheus/academic-targets.json]
