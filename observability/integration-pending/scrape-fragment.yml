# Merge these entries into scrape_configs ONLY during a separately reviewed integration.
# No running Prometheus configuration or mounted discovery file was changed.
scrape_configs:
  - job_name: cloudnest-email
    authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    static_configs: [{targets: [host.docker.internal:9467]}]
    sample_limit: 1000
    body_size_limit: 256KB
  - job_name: cloudnest-backup
    authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    static_configs: [{targets: [host.docker.internal:9468]}]
    sample_limit: 100
    body_size_limit: 64KB
