# TEMPLATE ONLY. No Service/Ingress is needed by a queue consumer.
apiVersion: apps/v1
kind: Deployment
metadata: {name: cloudnest-email-worker, namespace: cloudnest-integration}
spec:
  replicas: 1
  strategy: {type: Recreate} # One poller; shared lease additionally guards overlap.
  selector: {matchLabels: {app: cloudnest-email-worker}}
  template:
    metadata: {labels: {app: cloudnest-email-worker}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: cloudnest-email-worker:integration
          startupProbe: {exec: {command: [node, src/health.js, live]}, failureThreshold: 30, periodSeconds: 5}
          livenessProbe: {exec: {command: [node, src/health.js, live]}, periodSeconds: 15, timeoutSeconds: 3}
          readinessProbe: {exec: {command: [node, src/health.js, ready]}, periodSeconds: 15, timeoutSeconds: 3}
          envFrom: [{secretRef: {name: cloudnest-email-private}}]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 300m, memory: 192Mi}}
          volumeMounts: [{name: private-files, mountPath: /run/private, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes:
        - name: private-files
          secret: {secretName: cloudnest-email-files, defaultMode: 288}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
