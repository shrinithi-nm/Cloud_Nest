# TEMPLATE ONLY: requires teammate readiness/draining registration and private configuration.
apiVersion: v1
kind: Namespace
metadata: {name: cloudnest-integration}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cloudnest-api, namespace: cloudnest-integration}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cloudnest-api, namespace: cloudnest-integration}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: {matchLabels: {app: cloudnest-api}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  template:
    metadata: {labels: {app: cloudnest-api}}
    spec:
      serviceAccountName: cloudnest-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: cloudnest-api:integration
          ports: [{name: http, containerPort: 5000}]
          envFrom: [{configMapRef: {name: cloudnest-api-config}}, {secretRef: {name: cloudnest-api-private}}]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
          startupProbe: {httpGet: {path: /api/health, port: http}, failureThreshold: 30, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 15, timeoutSeconds: 2}
          readinessProbe: {httpGet: {path: /api/ready, port: http}, periodSeconds: 10, timeoutSeconds: 2}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: cloudnest-api, namespace: cloudnest-integration}
spec: {type: ClusterIP, selector: {app: cloudnest-api}, ports: [{name: http, port: 5000, targetPort: http}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cloudnest-api, namespace: cloudnest-integration}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cloudnest-api}
  minReplicas: 1
  maxReplicas: 2
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
  behavior:
    scaleDown: {stabilizationWindowSeconds: 180}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cloudnest-api, namespace: cloudnest-integration}
spec: {maxUnavailable: 1, selector: {matchLabels: {app: cloudnest-api}}}
